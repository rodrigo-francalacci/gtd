<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The inbox tray from the sidebar, scaled up. Greyscale like every other
    glyph in this app: the colour tokens are reserved for waiting, stale and
    selection, and a home-screen icon is not an exception worth making.

    The artwork sits inside the middle 60% so a maskable crop on Android
    cannot clip it.
  -->
  <rect width="512" height="512" rx="112" fill="#1c1c1c" />
  <g fill="none" stroke="#f5f5f4" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M136 168h240v176H136z" />
    <path d="M136 272h64l24 40h64l24-40h64" />
  </g>
</svg>
